name: Update Cheat Engine

on:
  schedule:
    # Run every day at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-cheatengine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    outputs:
      fail_reason: ${{ steps.check.outputs.fail_reason }}
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check for updates
        id: check
        continue-on-error: true
        run: |
          echo "Fetching latest Cheat Engine version from download page..."

          ERR_LOG="$(mktemp)"
          die() {
            echo "fail_reason=$1" | tr -d '\n\r' >> "$GITHUB_OUTPUT"
            echo "$1" >&2
            exit 1
          }
          # Harden the fetch: fail fast on connect, retry transient errors,
          # and capture the last error into ERR_LOG for the failure report.
          fetch_page() {
            curl -fsSL --connect-timeout 10 --max-time 30 --retry 3 --retry-delay 3 --retry-all-errors "$1" 2>>"$ERR_LOG" || true
          }

          # Scrape the downloads page for the Linux zip filename pattern
          LATEST_VERSION=$(fetch_page "https://cheatengine.org/downloads.php" | \
            grep -oP 'CheatEngineLinux\K[0-9]+(?=\.zip)' | \
            head -n 1)

          if [ -z "$LATEST_VERSION" ]; then
            die "Could not find latest version on download page. Last error: $(tail -n 1 "$ERR_LOG" 2>/dev/null || echo 'unknown')"
          fi

          # Convert version number: "77" -> "7.7", "710" -> "7.10"
          # The first character is the major version, the rest is the minor version
          LATEST_FORMATTED="${LATEST_VERSION:0:1}.${LATEST_VERSION:1}"

          echo "Latest found: $LATEST_FORMATTED"

          CURRENT_VERSION=$(grep -oP 'version = "\K[^"]+' package.nix)
          echo "Current: $CURRENT_VERSION"

          echo "fail_reason=" >> "$GITHUB_OUTPUT"

          if [ "$LATEST_FORMATTED" != "$CURRENT_VERSION" ]; then
            echo "New version available!"
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "version=$LATEST_FORMATTED" >> $GITHUB_OUTPUT
          else
            echo "Already up to date."
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update version
        if: steps.check.outputs.update_needed == 'true'
        run: |
          chmod +x ./update-version.sh
          ./update-version.sh "${{ steps.check.outputs.version }}"

      - name: Commit and Push
        if: steps.check.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update cheatengine to ${{ steps.check.outputs.version }}"
          git push

      - name: Close resolved failure issues
        if: steps.check.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL="auto-failure"
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true
          OPEN=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --json number --jq '.[].number')
          for n in $OPEN; do
            echo "Closing auto-failure issue #$n (workflow succeeded again)"
            gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "The Update Cheat Engine workflow succeeded again — closing automatically."
          done

      # continue-on-error above would let the job pass; fail the run when the check failed.
      - name: Fail the run
        if: steps.check.outcome == 'failure'
        run: exit 1

  report-failure:
    runs-on: ubuntu-latest
    needs: update-cheatengine
    if: failure()
    permissions:
      issues: write
    steps:
      - name: Open failure issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          LABEL="auto-failure"
          gh label create "$LABEL" --repo "$GITHUB_REPOSITORY" 2>/dev/null || true

          REASON="${{ needs.update-cheatengine.outputs.fail_reason }}"
          [ -n "$REASON" ] || REASON="See the failed run logs for details."

          TITLE="[auto] Update Cheat Engine workflow failed"
          BODY=$(printf 'The **Update Cheat Engine** workflow failed on %s.\n\n- Run: %s/%s/actions/runs/%s\n- Job: update-cheatengine\n\n**Failure reason:** %s\n\n_This issue was created automatically. It will be closed automatically when the workflow succeeds again._\n' "$(date -u +'%Y-%m-%d %H:%M UTC')" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$REASON")

          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --label "$LABEL" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            echo "Failure issue #$EXISTING already open — adding comment instead."
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "Still failing on run $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID — $REASON"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$TITLE" --label "$LABEL" --body "$BODY"
          fi
