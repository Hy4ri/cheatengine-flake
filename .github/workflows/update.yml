name: Update Cheat Engine

on:
  schedule:
    # Run every day at 12:00 UTC
    - cron: '0 12 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  update-cheatengine:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Check for updates
        id: check
        run: |
          echo "Fetching latest Cheat Engine version from download page..."

          # Scrape the downloads page for the Linux zip filename pattern
          LATEST_VERSION=$(curl -sL "https://cheatengine.org/downloads.php" | \
            grep -oP 'CheatEngineLinux\K[0-9]+(?=\.zip)' | \
            head -n 1)

          if [ -z "$LATEST_VERSION" ]; then
            echo "Could not find latest version on download page."
            exit 1
          fi

          # Convert version number: "77" -> "7.7", "710" -> "7.10"
          # The first character is the major version, the rest is the minor version
          LATEST_FORMATTED="${LATEST_VERSION:0:1}.${LATEST_VERSION:1}"

          echo "Latest found: $LATEST_FORMATTED"

          CURRENT_VERSION=$(grep -oP 'version = "\K[^"]+' package.nix)
          echo "Current: $CURRENT_VERSION"

          if [ "$LATEST_FORMATTED" != "$CURRENT_VERSION" ]; then
            echo "New version available!"
            echo "update_needed=true" >> $GITHUB_OUTPUT
            echo "version=$LATEST_FORMATTED" >> $GITHUB_OUTPUT
          else
            echo "Already up to date."
            echo "update_needed=false" >> $GITHUB_OUTPUT
          fi

      - name: Update version
        if: steps.check.outputs.update_needed == 'true'
        run: |
          chmod +x ./update-version.sh
          ./update-version.sh "${{ steps.check.outputs.version }}"

      - name: Commit and Push
        if: steps.check.outputs.update_needed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "chore: update cheatengine to ${{ steps.check.outputs.version }}"
          git push
